apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen-chat
  namespace: {{ .Release.Namespace }}
data:
  qwen-chat.py: |
{{ .Files.Get "files/qwen-chat.py" | indent 4 }}
  qwen-chat.html: |
{{ .Files.Get "files/qwen-chat.html" | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qwen-chat
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-chat
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: qwen-chat}
  template:
    metadata:
      labels: {app: qwen-chat}
      annotations:
        checksum/scripts: {{ printf "%s%s" (.Files.Get "files/qwen-chat.py") (.Files.Get "files/qwen-chat.html") | sha256sum }}
    spec:
      serviceAccountName: qwen-chat
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: chat
          image: {{ .Values.image | quote }}
          command: [python3, /app/qwen-chat.py, --port, "8080"]
          env:
            - {name: LISTEN_ADDRESS, value: "0.0.0.0"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - name: QWEN_BACKEND
              value: {{ .Values.backend | quote }}
            - name: PUBLIC_HOST
              value: {{ required "publicHost is required" .Values.publicHost | quote }}
            - name: PUBLIC_SCHEME
              value: {{ .Values.publicScheme | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
      volumes:
        - name: app
          configMap: {name: qwen-chat}
---
apiVersion: v1
kind: Service
metadata:
  name: qwen-chat
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  selector: {app: qwen-chat}
  ports:
    - name: http
      port: 8080
      targetPort: http
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
