apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen-chat
  namespace: {{ .Release.Namespace }}
data:
  qwen-chat.py: |
{{ .Files.Get "files/qwen-chat.py" | indent 4 }}
  qwen-chat.html: |
{{ .Files.Get "files/qwen-chat.html" | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qwen-chat
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-chat
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: qwen-chat}
  template:
    metadata:
      labels: {app: qwen-chat}
      annotations:
        checksum/scripts: {{ printf "%s%s" (.Files.Get "files/qwen-chat.py") (.Files.Get "files/qwen-chat.html") | sha256sum }}
    spec:
      serviceAccountName: qwen-chat
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: chat
          image: {{ .Values.image | quote }}
          command: [python3, /app/qwen-chat.py, --port, "8080"]
          env:
            - {name: LISTEN_ADDRESS, value: "0.0.0.0"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - name: QWEN_BACKEND
              value: {{ .Values.backend | quote }}
            - name: PUBLIC_HOST
              value: {{ required "route.host is required" .Values.route.host | quote }}
            - name: PUBLIC_SCHEME
              value: {{ ternary "https" "http" .Values.route.tls | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
      volumes:
        - name: app
          configMap: {name: qwen-chat}
---
apiVersion: v1
kind: Service
metadata:
  name: qwen-chat
  namespace: {{ .Release.Namespace }}
spec:
  selector: {app: qwen-chat}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: qwen-chat
  namespace: {{ .Release.Namespace }}
  annotations:
    haproxy.router.openshift.io/timeout: 130s
spec:
  host: {{ .Values.route.host | quote }}
  to: {kind: Service, name: qwen-chat}
  port: {targetPort: http}
  {{- if .Values.route.tls }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  {{- end }}
