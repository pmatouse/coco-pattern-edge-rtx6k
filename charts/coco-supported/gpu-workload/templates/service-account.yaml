apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-validator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gpu-validator-anyuid
rules:
  - apiGroups: [security.openshift.io]
    resources: [securitycontextconstraints]
    resourceNames: [anyuid]
    verbs: [use]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gpu-validator-anyuid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gpu-validator-anyuid
subjects:
  - kind: ServiceAccount
    name: gpu-validator
    namespace: {{ .Release.Namespace }}
