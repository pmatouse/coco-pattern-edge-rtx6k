apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-vectoradd
  labels:
    app: gpu-vectoradd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gpu-vectoradd
  template:
    metadata:
      labels:
        app: gpu-vectoradd
      annotations:
        coco.io/initdata-configmap: initdata
        {{- if .Values.defaultMemory }}
        io.katacontainers.config.hypervisor.default_memory: {{ .Values.defaultMemory | quote }}
        {{- end }}
    spec:
      serviceAccountName: gpu-validator
      initContainers:
        - name: prepare-results
          image: {{ .Values.resultsImage | quote }}
          command: ["/bin/sh", "-ec", "chown 0:0 /results; chmod 0775 /results"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: results
              mountPath: /results
      runtimeClassName: {{ .Values.runtimeClassName }}
      containers:
        - name: gpu-cc-verifier
          image: {{ .Values.image | quote }}
          securityContext:
            runAsUser: 1001
          imagePullPolicy: Always
          command: ["/bin/bash"]
          args:
            - -c
            - |
              set -euo pipefail
              rm -f /results/passed
              exec > /results/status.txt 2>&1
              echo GPU_TEST_START
              timeout 120 nvidia-smi --query-gpu=name,uuid,vbios_version,driver_version --format=csv
              timeout 120 nvidia-smi -q | sed -n '/Confidential/,+16p'
              timeout 120 /opt/cuda-samples/Samples/0_Introduction/vectorAdd/build/vectorAdd
              echo GPU_VECTORADD_PASS
              curl --fail --silent --show-error --max-time 120 http://127.0.0.1:8006/cdh/resource/default/kbsres1/key3 | sha256sum
              echo GPU_SECRET_FETCH_PASS
              touch /results/passed
              sleep 36000
          volumeMounts:
            - name: results
              mountPath: /results
            - name: initdata
              mountPath: /opt/confidential-containers/initdata
              readOnly: true
          resources:
            limits:
              nvidia.com/pgpu: 1
        - name: results
          securityContext:
            runAsUser: 1001
          image: {{ .Values.resultsImage | quote }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /passed
              port: 8080
            periodSeconds: 5
          volumeMounts:
            - name: results
              mountPath: /var/www/html
              readOnly: true
      volumes:
        - name: results
          emptyDir: {}
        - name: initdata
          configMap:
            name: initdata
            optional: false
