{{- if .Values.inference.enabled }}
{{- if not (has .Values.inference.servingMode (list "deployment" "kserve")) }}
{{- fail "inference.servingMode must be deployment or kserve" }}
{{- end }}
{{- if and (eq .Values.inference.servingMode "kserve") (lt (int .Values.inference.replicas) 1) }}
{{- fail "inference.replicas must be at least 1 with KServe Standard mode" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  name: encrypted-inference-scripts
data:
  artifact.py: |
{{ .Files.Get "files/artifact.py" | indent 4 }}
  gpu_security.py: |
{{ .Files.Get "files/gpu_security.py" | indent 4 }}
  guest.py: |
{{ .Files.Get "files/guest.py" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  name: inference-registry-ca
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: {{ .Release.Namespace }}
  name: encrypted-inference
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ .Release.Namespace }}
  name: encrypted-inference-anyuid
rules:
  - apiGroups: [security.openshift.io]
    resources: [securitycontextconstraints]
    resourceNames: [anyuid]
    verbs: [use]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: {{ .Release.Namespace }}
  name: encrypted-inference-anyuid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: encrypted-inference-anyuid
subjects:
  - kind: ServiceAccount
    name: encrypted-inference
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ .Release.Namespace }}
  name: encrypted-qwen-pull
rules:
  - apiGroups: [image.openshift.io]
    resources: [imagestreams/layers]
    resourceNames: [encrypted-qwen3-06b]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: {{ .Release.Namespace }}
  name: encrypted-qwen-pull
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: encrypted-qwen-pull
subjects:
  - kind: ServiceAccount
    name: encrypted-inference
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: encrypted-qwen
{{- if eq .Values.inference.servingMode "kserve" }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
{{- end }}
spec:
{{- if eq .Values.inference.servingMode "kserve" }}
  replicas: 0
{{- else }}
  replicas: {{ .Values.inference.replicas | default 0 }}
{{- end }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: encrypted-qwen
  template:
    metadata:
      labels:
        app: encrypted-qwen
      annotations:
        coco.io/initdata-configmap: initdata
        io.katacontainers.config.hypervisor.default_memory: {{ .Values.inference.memoryMiB | quote }}
        io.katacontainers.config.hypervisor.default_vcpus: {{ .Values.inference.cpus | quote }}
        checksum/scripts: {{ printf "%s%s%s" (.Files.Get "files/artifact.py") (.Files.Get "files/guest.py") (.Files.Get "files/gpu_security.py") | sha256sum }}
    spec:
{{ include "encrypted-inference.podSpec" (dict "Values" .Values "Files" .Files "containerName" "vllm") | indent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: encrypted-qwen
spec:
{{- if eq .Values.inference.servingMode "kserve" }}
  selector:
    app: isvc.encrypted-qwen-predictor
    serving.kserve.io/inferenceservice: encrypted-qwen
{{- else }}
  selector: {app: encrypted-qwen}
{{- end }}
  ports:
    - {name: inference, port: 8000, targetPort: 8000}
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: encrypted-qwen-status
spec:
  publishNotReadyAddresses: true
{{- if eq .Values.inference.servingMode "kserve" }}
  selector:
    app: isvc.encrypted-qwen-predictor
    serving.kserve.io/inferenceservice: encrypted-qwen
{{- else }}
  selector: {app: encrypted-qwen}
{{- end }}
  ports:
    - {name: results, port: 8080, targetPort: 8080}
{{- end }}
